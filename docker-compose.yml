version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sarc
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["pgdata:/var/lib/postgresql/data"]

  class-service:
    build: ./class-service
    depends_on: [db]
    ports: ["8081:8081"]

  user-service:
    build: ./user-service
    depends_on: [db]
    ports: ["8082:8082"]

  booking-service:
    build: ./booking-service
    depends_on: [db]
    ports: ["8083:8083"]

volumes:
  booking-data:
    name: booking-data
  class-data:
    name: class-data
  user-data:
    name: user-data
